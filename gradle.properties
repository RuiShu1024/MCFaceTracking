# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod properties
# The first two version components are the protocol handshake version and must stay in sync
# with MCFaceTracking-plugin (see MCFTClient.checkVersion).
mod_version = 1.0.4.7
maven_group = com.github.squi2rel.mcft
archives_name = mcft

# Minecraft properties
# 26.1 and later are shipped unobfuscated, so no mappings dependency is needed.
minecraft_version = 26.1.2

# Dependencies
# check these on https://fabricmc.net/develop
loader_version = 0.19.5
loom_version = 1.17.20
fabric_api_version = 0.155.2+26.1.2
