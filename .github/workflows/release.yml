# Builds a tagged commit and publishes the jars to a GitHub Release.
#
# Triggered automatically by pushing a tag that starts with "v", or manually
# from the Actions tab for a tag that already exists (the workflow file is read
# from this branch, so the tagged commit itself does not need to contain it).
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.0.4.7-mc26.1.2'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew build --stacktrace

      - name: Read gradle.properties
        id: props
        run: |
          read_prop() { sed -n "s/^ *$1 *= *//p" gradle.properties | tr -d '\r'; }
          MOD_VERSION="$(read_prop mod_version)"
          {
            echo "mod_version=$MOD_VERSION"
            echo "minecraft_version=$(read_prop minecraft_version)"
            echo "loader_version=$(read_prop loader_version)"
            echo "fabric_api_version=$(read_prop fabric_api_version)"
            echo "protocol_version=$(echo "$MOD_VERSION" | cut -d. -f1,2)"
          } >> "$GITHUB_OUTPUT"

      - name: Render release notes
        env:
          MOD_VERSION: ${{ steps.props.outputs.mod_version }}
          MINECRAFT_VERSION: ${{ steps.props.outputs.minecraft_version }}
          LOADER_VERSION: ${{ steps.props.outputs.loader_version }}
          FABRIC_API_VERSION: ${{ steps.props.outputs.fabric_api_version }}
          PROTOCOL_VERSION: ${{ steps.props.outputs.protocol_version }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Face tracking for Minecraft: drives your player model's eyes and mouth from a
          webcam or VTuber tracking source. This build is the single-module Fabric port
          for Minecraft %MINECRAFT_VERSION%.

          ### Downloads

          | File | Description |
          | --- | --- |
          | `mcft-%MOD_VERSION%.jar` | The mod. Put this one in `mods/`. |
          | `mcft-%MOD_VERSION%-sources.jar` | Sources, for developers only. |

          ### Requirements

          - Minecraft **%MINECRAFT_VERSION%** (accepts `~26.1`)
          - [Fabric Loader](https://fabricmc.net/use/installer/) **%LOADER_VERSION%** or newer (minimum `0.19.3`)
          - [Fabric API](https://modrinth.com/mod/fabric-api) — built against `%FABRIC_API_VERSION%`
          - **Java 25 or newer** — the runtime bundled with Minecraft %MINECRAFT_VERSION% already satisfies this

          ### Install

          1. Install Fabric Loader for %MINECRAFT_VERSION%.
          2. Drop `mcft-%MOD_VERSION%.jar` and Fabric API into `.minecraft/mods/`.
          3. Launch the game and configure your tracking source in the mod's settings screen.

          The mod loads in both environments (`"environment": "*"`). Every player who wants
          to send or see tracking data needs it installed; the server side only relays packets.

          ### Server plugin compatibility

          The **first two components of the version number are the protocol handshake
          version** and must match on both ends (see `MCFTClient.checkVersion`). This build
          speaks protocol **%PROTOCOL_VERSION%**, so pair it with a `MCFaceTracking-plugin`
          build in the **%PROTOCOL_VERSION%.x** line when running non-Fabric server software.
          A mismatch shows the in-game version-mismatch warning instead of tracking anyone.

          ### Notes on the 26.1.2 port

          - Minecraft 26.1 and later ship unobfuscated, so the `mappings` dependency is gone.
          - `common/` and `fabric/` were merged into one source root and the `neoforge`
            module was dropped — this branch is Fabric-only.
          - Rendering was rewritten for the current pipeline: `ModelPart.Cube.compile()`
            replaces `renderCuboid()`, and `CubeDefinition.bake()` now builds `FTCuboid`
            through a real constructor instead of `ReflectionFactory`, deferring geometry
            through `ModelSubmit`.
          - `FTCuboid` gained a general-purpose hole tiler. This also fixes a face-tearing
            bug in the old code, which assumed the right eye was always left of the left eye
            and produced negative widths when it was not.

          ### Credits

          - [@squi2rel](https://github.com/squi2rel) — original mod
          - [@cloudfl4re](https://github.com/cloudfl4re) — Sodium rendering fix
          - [@RuiShu1024](https://github.com/RuiShu1024) — Minecraft %MINECRAFT_VERSION% Fabric port

          ---

          ## 中文说明

          MCFaceTracking 把摄像头 / VTuber 面捕数据接进 Minecraft，用来驱动玩家模型的眼睛和嘴巴。
          本次发布是面向 Minecraft %MINECRAFT_VERSION% 的单模块 Fabric 移植版。

          **环境要求**：Minecraft %MINECRAFT_VERSION%、Fabric Loader %LOADER_VERSION% 及以上（最低 `0.19.3`）、
          Fabric API（基于 `%FABRIC_API_VERSION%` 构建）、Java 25 及以上（26.1 自带的运行时已经是 Java 25，
          用官方启动器无需额外安装）。

          **安装**：把 `mcft-%MOD_VERSION%.jar` 和 Fabric API 一起放进 `.minecraft/mods/`。
          带 `-sources` 的是源码包，普通玩家不需要下载。客户端和服务端都能加载，想发送或看到面捕
          效果的玩家都要装，服务端只负责转发数据包。

          **服务端插件**：版本号前两位是协议握手版本，两端必须一致。本版本协议号为 %PROTOCOL_VERSION%，
          非 Fabric 服务端请搭配 %PROTOCOL_VERSION%.x 的 MCFaceTracking-plugin，否则进服后只会收到
          版本不匹配的提示。

          **移植说明**：26.1 起游戏不再混淆，因此去掉了 mappings 依赖；`common/` 与 `fabric/` 合并成
          单一源码根，移除 `neoforge` 模块；渲染按新管线重写（`ModelPart.Cube.compile()` 取代
          `renderCuboid()`，`CubeDefinition.bake()` 改用真实构造器创建 `FTCuboid` 并通过 `ModelSubmit`
          提交）；`FTCuboid` 新增通用打洞逻辑，顺带修掉了旧代码假设右眼一定在左眼左侧、不满足时
          宽度为负导致脸部撕裂的问题。
          NOTES

          sed -i \
            -e "s/%MOD_VERSION%/$MOD_VERSION/g" \
            -e "s/%MINECRAFT_VERSION%/$MINECRAFT_VERSION/g" \
            -e "s/%LOADER_VERSION%/$LOADER_VERSION/g" \
            -e "s/%FABRIC_API_VERSION%/$FABRIC_API_VERSION/g" \
            -e "s/%PROTOCOL_VERSION%/$PROTOCOL_VERSION/g" \
            "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          TITLE: MCFaceTracking ${{ steps.props.outputs.mod_version }} for Minecraft ${{ steps.props.outputs.minecraft_version }} (Fabric)
        run: |
          extra=()
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) extra+=(--prerelease) ;;
          esac

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" build/libs/*.jar --clobber
          else
            gh release create "$TAG" build/libs/*.jar \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${extra[@]}"
          fi

          gh release view "$TAG" --json url,name,assets --jq '.url, .name, (.assets[] | .name)'
